<!doctype html>
<html lang="it" data-phosphor="verde">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#030803" />
    <meta name="description" content="Gioco narrativo: un terminale rimasto acceso in un sito di contenimento abbandonato." />
    <title>Terminale</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23030803'/%3E%3Crect x='3' y='11' width='6' height='2' fill='%2333ff77'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('terminale:tema');
        if (t === 'ambra' || t === 'verde') document.documentElement.dataset.phosphor = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="crt">
      <main id="screen" class="crt-screen" aria-label="Terminale"></main>
      <div class="crt-overlay" aria-hidden="true"></div>
    </div>
    <nav class="touchbar" aria-label="Tasti rapidi">
      <button type="button" data-key="tab">Tab</button>
      <button type="button" data-key="up" aria-label="Comando precedente">↑</button>
      <button type="button" data-key="down" aria-label="Comando successivo">↓</button>
      <button type="button" data-key="skip">Salta</button>
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
