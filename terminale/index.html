<!doctype html>
<html lang="it" data-phosphor="verde">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#2c3a3d" />
    <meta name="description" content="FONDAZIONE OS: un computer rimasto acceso in un sito di contenimento abbandonato. Gioco narrativo nel browser." />
    <title>FONDAZIONE OS</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2320304f'/%3E%3Ccircle cx='8' cy='8' r='5' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('terminale:tema');
        if (t === 'ambra' || t === 'verde') document.documentElement.dataset.phosphor = t;
        var o = localStorage.getItem('terminale:os');
        if (o === 'moderno' || o === 'classico') document.documentElement.dataset.os = o;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
